name: Client build

# Builds this fork for the platforms the panel's users install it on. Release
# signing needs KEYSTORE (base64 of a .jks), KEY_ALIAS, STORE_PASSWORD and
# KEY_PASSWORD as repository secrets; without them the APK is debug signed and
# carries the .dev application id suffix, so it can be tested but not shipped.
#
# Runner quirks handled here, each one learned from a failed run:
#   * Android frees disk first, because the NDK, the Flutter and Gradle caches
#     and the Go core together overflow the volume, and that failure surfaces as
#     an IO error from the runner itself rather than as a build error.
#   * Both jobs put the pub cache bin on PATH: setup.dart activates
#     flutter_distributor as a global executable and then calls it by name.
#   * The Windows exe target runs Inno Setup's ISCC.exe through a shell that
#     does not quote the path, so INNO_SETUP_PATH points at a junction without
#     spaces instead of the default installation directory.
#   * Both Package steps disable errexit and echo the tail of their output as
#     annotations, so a failure stays readable without the job log.
#   * Packaged files are published as release assets when the dispatch supplies
#     a release_tag. Artifact storage is one small quota shared by the whole
#     account, and a full quota fails the upload step, so the artifacts are a
#     convenience and the release is the deliverable.
#
# A push builds Android only. Dispatch this workflow by hand when you need the
# Windows installer: Actions minutes are metered on this private repository, and
# a Windows runner bills them at twice the Linux rate.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish the installers to, for example v0.9.2-t2. Empty uploads artifacts only.
        required: false
        type: string
      skip_windows:
        description: Skip the Windows job when only the Android build is needed.
        required: false
        type: boolean
        default: false
      skip_android:
        description: Skip the Android job when only the Windows build is needed.
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
      - xb/rebrand-t1

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # Publishing to a release needs write; artifacts alone would only need read.
  contents: write

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  CA_BUNDLE: cacert-2026-09-25.pem
  CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505

jobs:
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.skip_android != true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
          # The Android build fills this 72 GB volume: 24 GB in twenty minutes,
          # ending in a 100% full disk and a step that stops with no error at
          # all in the log. These deletions are what keep it off that ceiling.
          nproc
          free -m
          df -h /

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Android signing
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > android/local.properties
            echo "Release signing configured."
          else
            echo "No KEYSTORE secret: this APK is debug signed with the .dev suffix."
          fi

      - name: Fetch CA certificates
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Install dependencies
        run: flutter pub get

      - name: Add pub cache bin to PATH
        run: |
          cache="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "pub cache: $cache"
          echo "$cache/bin" >> "$GITHUB_PATH"

      - name: Test
        run: |
          set +e
          flutter test test/providers/panel_account_test.dart test/tool/packaging_config_test.dart test/android_tv_launcher_icon_test.dart test/common/protocol_test.dart test/common/link_test.dart test/common/system_test.dart --reporter expanded 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            tail -45 test.log | sed 's/%/%25/g' |
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit "$code"

      # The whole suite and the coverage floors stay with build.yaml, which gates
      # every push on them; this workflow only packages.

      - name: Package
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          set +e
          # This build has twice died with nothing at all in the log, in the
          # middle of resource merging, so sample the runner until the step
          # ends: the job log is the only place that death shows up.
          timeout 45m bash -c '
            while true; do
              echo "== probe $(date -u +%H:%M:%S) =="
              free -m | head -3
              df -h / | tail -1
              ps -eo rss,comm --sort=-rss | head -6
              sudo dmesg -T 2>/dev/null | grep -iE "out of memory|oom-kill|killed process" | tail -3
              sleep 30
            done' &
          dart setup.dart android -v 2>&1 | tee package.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -n -E 'FAILURE|What went wrong|Execution failed|error:|Error:|Caused by|Could not|> ' package.log |
              tail -20 | sed 's/%/%25/g; s/\r$//' |
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          df -h /
          exit "$code"

      - name: Report what was packaged
        run: |
          ls -lh dist
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | tail -1)
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          for apk in dist/*.apk; do
            [ -e "$apk" ] || continue
            echo "::notice::$apk $(stat -c %s "$apk") bytes"
            if [ -n "$aapt2" ]; then
              "$aapt2" dump badging "$apk" 2>/dev/null |
                grep -E "^package:|^application-label:" |
                while IFS= read -r line; do echo "::notice::$(basename "$apk") $line"; done
            fi
            if [ -n "$apksigner" ]; then
              # Print it raw: filtering this once hid the very line it exists to show.
              "$apksigner" verify --print-certs "$apk" 2>&1 | head -6 | sed 's/%/%25/g' |
                while IFS= read -r line; do echo "::notice::$(basename "$apk") $line"; done
            else
              echo "::warning::no apksigner under $ANDROID_HOME/build-tools"
            fi
          done

      - name: Publish to release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Bear Booster $TAG" \
              --notes "Installers are attached as assets." ||
              echo "::warning::another job created $TAG first"
          fi
          ok=0
          for attempt in 1 2 3; do
            if gh release upload "$TAG" dist/* --clobber; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::could not upload to release $TAG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: client-android
          path: ./dist
          overwrite: true
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' && inputs.skip_windows != true
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $default = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $default)) {
            choco install innosetup --no-progress -y
          }
          $source = 'C:\Program Files (x86)\Inno Setup 6'
          if (-not (Test-Path (Join-Path $source 'ISCC.exe'))) {
            $source = (Get-ChildItem 'C:\Program Files (x86)' -Filter 'Inno Setup*' -Directory |
              Sort-Object Name -Descending | Select-Object -First 1).FullName
          }
          if (Test-Path 'C:\innosetup') { Remove-Item 'C:\innosetup' -Force -Recurse }
          New-Item -ItemType Junction -Path 'C:\innosetup' -Target $source | Out-Null
          "INNO_SETUP_PATH=C:\innosetup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & 'C:\innosetup\ISCC.exe' /? | Select-Object -First 3

      - name: Fetch CA certificates
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Install dependencies
        run: flutter pub get

      - name: Add pub cache bin to PATH
        shell: pwsh
        run: |
          $cache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path $env:LOCALAPPDATA 'Pub\Cache' }
          Write-Output "pub cache: $cache"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $cache 'bin')

      - name: Package
        shell: pwsh
        run: |
          dart setup.dart windows -v 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content package.log -Tail 25 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace '%', '%25'))
            }
            exit $LASTEXITCODE
          }

      - name: Report what was packaged
        shell: pwsh
        run: |
          Get-ChildItem dist -Recurse -File | ForEach-Object {
            $relative = $_.FullName.Replace((Get-Location).Path + '\', '')
            Write-Output ("::notice::{0}  {1:N1} MB" -f $relative, ($_.Length / 1MB))
          }

      - name: Publish to release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release view $env:TAG --json tagName 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title ("Bear Booster " + $env:TAG) --notes "Installers are attached as assets."
          }
          $files = @(Get-ChildItem dist -Recurse -File | ForEach-Object { $_.FullName })
          foreach ($attempt in 1..3) {
            gh release upload $env:TAG $files --clobber
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 10
          }
          Write-Output ("::error::could not upload to release " + $env:TAG)
          exit 1

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: client-windows
          path: ./dist
          overwrite: true
          if-no-files-found: error
