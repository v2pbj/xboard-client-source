name: Client build

# Builds this fork for the platforms the panel's users install it on. Release
# signing needs KEYSTORE (base64 of a .jks), KEY_ALIAS, STORE_PASSWORD and
# KEY_PASSWORD as repository secrets; without them the APK is debug signed and
# carries the .dev application id suffix, so it can be tested but not shipped.
#
# Two runner quirks are handled here. Android frees disk first, because the NDK,
# the Flutter and Gradle caches and the Go core together overflow the volume and
# the failure then surfaces as an IO error from the runner itself. Both jobs put
# the pub cache bin on PATH, because setup.dart installs flutter_distributor as
# a global executable and then calls it by name.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - xb/rebrand-t1

concurrency:
  group: client-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'
  NDK_VERSION: r28c
  CA_BUNDLE: cacert-2026-09-25.pem
  CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/ndk
          sudo apt-get clean
          df -h /

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: nttld/setup-ndk@v1
        id: build-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true
          link-to-sdk: true

      - uses: gradle/actions/setup-gradle@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Android signing
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
            {
              echo "keyAlias=${{ secrets.KEY_ALIAS }}"
              echo "storePassword=${{ secrets.STORE_PASSWORD }}"
              echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
            } > android/local.properties
            echo "Release signing configured."
          else
            echo "No KEYSTORE secret: this APK is debug signed with the .dev suffix."
          fi

      - name: Fetch CA certificates
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Install dependencies
        run: flutter pub get

      - name: Add pub cache bin to PATH
        run: |
          cache="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "pub cache: $cache"
          echo "$cache/bin" >> "$GITHUB_PATH"

      # The packaging step runs for several minutes and its failure has to be
      # readable from the public API, so the tail of the output is echoed as
      # annotations instead of being left inside the job log.
      - name: Package
        env:
          ANDROID_NDK_HOME: ${{ steps.build-ndk.outputs.ndk-path }}
        run: |
          set -o pipefail
          dart setup.dart android -v 2>&1 | tee package.log
          code=$?
          if [ "$code" -ne 0 ]; then
            tail -c 4000 package.log | sed 's/%/%25/g; s/\r$//' |
              while IFS= read -r line; do echo "::error::$line"; done
          fi
          df -h /
          exit "$code"

      - uses: actions/upload-artifact@v4
        with:
          name: client-android
          path: ./dist
          overwrite: true
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum
            plugins/setup/setup_hooks/lib/src/go_builder.dart

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Fetch CA certificates
        shell: bash
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      - name: Install dependencies
        run: flutter pub get

      - name: Add pub cache bin to PATH
        shell: pwsh
        run: |
          $cache = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { Join-Path $env:LOCALAPPDATA 'Pub\Cache' }
          Write-Output "pub cache: $cache"
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $cache 'bin')

      - name: Package
        shell: pwsh
        run: |
          dart setup.dart windows -v 2>&1 | Tee-Object -FilePath package.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content package.log -Tail 25 | ForEach-Object {
              Write-Output ("::error::" + ($_ -replace '%', '%25'))
            }
            exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v4
        with:
          name: client-windows
          path: ./dist
          overwrite: true
          if-no-files-found: error
